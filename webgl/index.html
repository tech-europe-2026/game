<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Skyroll</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none;
        background: linear-gradient(#78aaf5, #bad6ff 55%, #ffded6); font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #1e284e; letter-spacing: .2em; font-weight: 700; }
      #bar { width: 240px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.6); margin-top: 18px; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
      #fill { width: 0; height: 100%; background: #ecbe54; transition: width .2s; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">SKYROLL<div id="bar"><div id="fill"></div></div></div>
    <script src="Build/webgl.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      createUnityInstance(canvas, {
        dataUrl: "Build/webgl.data.unityweb",
        frameworkUrl: "Build/webgl.framework.js.unityweb",
        codeUrl: "Build/webgl.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "TechEurope2026",
        productName: "Skyroll",
        productVersion: "1.0",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      }, function (p) { document.querySelector("#fill").style.width = (p * 100) + "%"; })
      .then(function () { document.querySelector("#loading").remove(); canvas.focus(); });
      window.addEventListener("click", function () { canvas.focus(); });
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    </script>
  </body>
</html>
