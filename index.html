<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACKICE TERMINAL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="terminal">
        <div id="titlebar">
            <span id="title-text">BLACKICE // REMOTE SHELL</span>
            <span id="trace-counter">TRACES: 0</span>
        </div>
        <div id="output"></div>
        <div id="input-line">
            <span id="prompt"></span>
            <input id="cmd" type="text" autocomplete="off" spellcheck="false" autofocus>
        </div>
    </div>
    <script src="terminal.js"></script>
</body>
</html>
